name: Build Native Android App (ripple.apk)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use Node 20 LTS (safe for Capacitor 7)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (FIXED)
        run: npm install

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://mock-supabase.ripple.com"
          VITE_SUPABASE_ANON_KEY: "mock-anon-key"

      - name: Install Capacitor 7 (Java 17 safe)
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Init Capacitor (safe)
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init Ripple com.ripple.app --web-dir=dist
          fi

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ripple.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ripple-apk
          path: build-artifacts/ripple.apk
