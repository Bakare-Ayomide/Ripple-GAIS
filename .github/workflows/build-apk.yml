name: Build Ripple APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      # ❌ IMPORTANT: REMOVE old android folder completely
      - name: Clean Android (force fresh generation)
        run: rm -rf android

      # 🔥 LOCK CAPACITOR VERSION (CRITICAL)
      - name: Install Capacitor 7 ONLY
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Init Capacitor
        run: npx cap init Ripple com.ripple.app --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # 🔥 FORCE SAFE JAVA 17 GRADLE CONFIG
      - name: Force Java 17 Gradle config
        run: |
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/**/*.gradle || true
          sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' android/**/*.gradle || true
          sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' android/**/*.gradle || true

      - name: Verify Java
        run: java -version

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ripple-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
